name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 27 with Xcode 27. The macos-26 and macos-latest images can't run this app's minimum OS.
    runs-on: xcode-27
    # A full run takes about 5 minutes. Without a limit, a hang runs for GitHub's default of 6 hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: SwiftFormat
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict

      - name: Keep MinutesStorage free of UI frameworks
        run: |
          if grep -rEq '^(@preconcurrency )?import (SwiftUI|AppKit)' Packages/MinutesKit/Sources/MinutesStorage; then
            echo "MinutesStorage must stay usable from a separate process."
            exit 1
          fi

      - name: Require license headers in C and Objective-C files
        run: |
          missing=$(grep -rL 'SPDX-License-Identifier: GPL-3.0-or-later' Packages/MinutesKit/Sources/MinutesAudioRT || true)
          if [ -n "$missing" ]; then
            echo "Missing SPDX header:"
            echo "$missing"
            exit 1
          fi

      # Includes building the package. If the tests hang, the script prints the stuck threads and fails.
      - name: Unit tests
        timeout-minutes: 20
        run: scripts/test-with-watchdog.sh 15

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (ad-hoc signed)
        run: >
          xcodebuild build
          -project Minutes.xcodeproj
          -scheme Minutes
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build

      - name: Verify app bundle
        run: scripts/verify-bundle.sh build/Build/Products/Release/Minutes.app

      # Uses fake audio sources, because nothing can grant this runner audio permissions.
      - name: UI test
        run: >
          xcodebuild test
          -project Minutes.xcodeproj
          -scheme Minutes
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build
          -only-testing:MinutesUITests
