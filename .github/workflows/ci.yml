# SPDX-License-Identifier: GPL-3.0-or-later

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 27 with Xcode 27. The macos-26 and macos-latest images can't run this app's minimum OS.
    runs-on: xcode-27
    # A full run takes about 15 minutes. Without a limit, a hang runs for GitHub's default of 6 hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SwiftPM and xcodebuild share this cache of package clones and binary downloads, so each run
      # skips fetching FluidAudio, Sparkle and llama.cpp. An older cache still saves most of the fetch.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Packages/MinutesKit/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Install build tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: SwiftFormat
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict

      - name: Keep MinutesStorage free of UI frameworks
        run: |
          if grep -rEq '^(@preconcurrency )?import (SwiftUI|AppKit)' Packages/MinutesKit/Sources/MinutesStorage; then
            echo "MinutesStorage must stay usable from a separate process."
            exit 1
          fi

      - name: Require license headers in C and Objective-C files
        run: |
          missing=$(grep -rL 'SPDX-License-Identifier: GPL-3.0-or-later' Packages/MinutesKit/Sources/MinutesAudioRT || true)
          if [ -n "$missing" ]; then
            echo "Missing SPDX header:"
            echo "$missing"
            exit 1
          fi

      # Includes building the package. If the tests hang, the script prints the stuck threads and fails.
      - name: Unit tests
        timeout-minutes: 20
        run: scripts/test-with-watchdog.sh 15

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check the Homebrew cask template
        run: scripts/render-cask.sh --check

      # The release workflow's build, ad-hoc signed, so a broken DMG shows up before a tag. It's also
      # this run's Release build: the script runs verify-bundle.sh on the exported app.
      - name: Build a release DMG
        run: |
          python3 -m venv build/dmgbuild
          build/dmgbuild/bin/pip install --require-hashes -r packaging/dmg/requirements.txt
          DMGBUILD=build/dmgbuild/bin/dmgbuild scripts/build-release.sh 0.0.0-ci

      # Uses fake audio sources, because nothing can grant this runner audio permissions.
      - name: UI test
        run: >
          xcodebuild test
          -project Minutes.xcodeproj
          -scheme Minutes
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build
          -only-testing:MinutesUITests
