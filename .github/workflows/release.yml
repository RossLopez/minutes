# SPDX-License-Identifier: GPL-3.0-or-later
#
# On a v* tag: build, sign, notarize and staple the app and DMG, write the Sparkle appcast, publish
# the GitHub release, and update the Homebrew cask. docs/RELEASING.md describes each secret. Without
# them (a fork), it publishes an ad-hoc signed DMG with updates turned off.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
      HAS_TAP: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the number of commits.
          fetch-depth: 0

      - name: Read the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then
            echo "PRERELEASE=true" >>"$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >>"$GITHUB_ENV"
          fi
          mkdir -p build
          # Fails when CHANGELOG.md has no section for this version.
          scripts/changelog-section.sh "$version" >build/release-notes.md

      - name: Check the update key
        if: env.HAS_SPARKLE == 'true'
        run: |
          if ! grep -Eq '^SPARKLE_PUBLIC_KEY = .+' Config/Release.xcconfig; then
            echo "SPARKLE_ED_PRIVATE_KEY is set, but Config/Release.xcconfig has no public key."
            exit 1
          fi

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv build/dmgbuild
          build/dmgbuild/bin/pip install --require-hashes -r packaging/dmg/requirements.txt
          echo "DMGBUILD=$PWD/build/dmgbuild/bin/dmgbuild" >>"$GITHUB_ENV"

      - name: Import the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$CERT_P12" >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity in the certificate."
            exit 1
          fi
          echo "DEVELOPER_ID_IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Write the notary key
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >>"$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # Without the appcast's key, this build's updates could never be published.
          if [[ "$HAS_SPARKLE" != true ]]; then
            export UPDATES_OFF=1
          fi
          scripts/build-release.sh "$VERSION"
          echo "BUILD_NUMBER=$(plutil -extract CFBundleVersion raw build/release/export/Minutes.app/Contents/Info.plist)" >>"$GITHUB_ENV"

      - name: Write the appcast
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/make-appcast.sh "build/release/Minutes-$VERSION-arm64.dmg" "$VERSION" "$BUILD_NUMBER"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("build/release/Minutes-$VERSION-arm64.dmg" "build/release/Minutes-$VERSION-arm64.dmg.sha256")
          if [[ -f build/release/appcast.xml ]]; then
            files+=(build/release/appcast.xml)
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "Minutes $VERSION" \
            --notes-file build/release-notes.md "${flags[@]}"

      - name: Update the Homebrew cask
        if: env.HAS_TAP == 'true' && env.PRERELEASE == 'false'
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          sha256="$(cut -d' ' -f1 "build/release/Minutes-$VERSION-arm64.dmg.sha256")"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/RossLopez/homebrew-tap.git" build/tap
          scripts/render-cask.sh "$VERSION" "$sha256" build/tap/Casks/minutes.rb
          cd build/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/minutes.rb
          git commit -m "minutes $VERSION"
          git push

      - name: Remove the signing keychain and keys
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
