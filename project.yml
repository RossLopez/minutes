# Run `xcodegen generate` after cloning or after changing this file.

name: Minutes

options:
  bundleIdPrefix: io.github.rosslopez
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  # Release adds the update key to the signing settings.
  Release: Config/Release.xcconfig

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  MinutesKit:
    path: Packages/MinutesKit
  # MIT, with BSD, MIT and zlib parts listed in THIRD_PARTY_NOTICES.md. Checks for and installs
  # updates from the appcast on GitHub Releases. An exact version, so an update is a reviewed change.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  Minutes:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rosslopez.minutes
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Minutes.entitlements
        # App/AppIcon.icon, made in Icon Composer's format. actool builds the icon and Assets.car from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - package: MinutesKit
        products:
          - MinutesAudio
          - MinutesTranscription
          - MinutesDiarization
          - MinutesLLM
          - MinutesLlama
          - MinutesStorage
          - MinutesPipeline
          - MinutesSearch
          - MinutesFluidAudio
      - package: Sparkle
    scheme:
      testTargets:
        - MinutesUITests

  MinutesUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AppUITests
      # The demo meeting, shared with the app's demo mode so both say the same thing.
      - path: App/Demo/DemoContent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rosslopez.minutes.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: AppUITests/MinutesUITests.entitlements
    dependencies:
      - target: Minutes
      # ScreenshotUITests writes its demo library in the real format.
      - package: MinutesKit
        products:
          - MinutesSearch
          - MinutesStorage
